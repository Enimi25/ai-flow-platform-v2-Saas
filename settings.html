<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#061923;
  --bg2:#040f16;
  --sidebarA:rgba(6, 25, 35, 0.92);
  --panel:rgba(255,255,255,0.06);
  --panel2:rgba(255,255,255,0.04);
  --input:rgba(255,255,255,0.06);
  --text:#f7fbff;
  --muted:#9fb7c3;
  --border:rgba(255,255,255,0.12);
  --border2:rgba(255,255,255,0.08);
  --accent:#b8ff7a;
  --accent2:#41dcff;
  --shadow:0 30px 80px rgba(0,0,0,.16);
  --shadowSm:0 18px 50px rgba(0,0,0,.18);
}

body{
  background:
    radial-gradient(980px 720px at 14% -10%, rgba(184,255,122,0.18), transparent 58%),
    radial-gradient(900px 700px at 110% 10%, rgba(65,220,255,0.14), transparent 55%),
    radial-gradient(760px 640px at 70% 120%, rgba(139,92,246,0.10), transparent 58%),
    var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
  line-height:1.4;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:linear-gradient(180deg, rgba(6, 25, 35, 0.92) 0%, rgba(4, 15, 22, 0.98) 100%);
  backdrop-filter: blur(18px);
  border-right:1px solid var(--border);
  padding:26px 18px;
  height:100vh;
  position:sticky;
  top:0;
  overflow:auto;
}

.logo{
  font-size:26px;
  font-weight:950;
  margin-bottom:22px;
  letter-spacing:.2px;
}

.logo span{color:var(--accent)}

.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:6px;
}

.menu a{
  text-decoration:none;
  color:#d7e6eb;
  padding:12px 12px;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease;
}

.menu a:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.12);
  color:var(--text);
}

.menu .active{
  background:linear-gradient(135deg, rgba(184,255,122,0.95) 0%, rgba(65,220,255,0.72) 100%);
  color:#071820;
  font-weight:900;
  border-color:rgba(0,0,0,.12);
  box-shadow:0 20px 60px rgba(184,255,122,0.16);
}

.main{
  flex:1;
  padding:32px 28px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.main > *{
  width:100%;
  max-width:1160px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}

h1{
  font-size:38px;
  margin-bottom:10px;
  letter-spacing:-.2px;
}

.sub{
  color:var(--muted);
  font-size:16px;
}

.user{
  display:flex;
  align-items:center;
  gap:14px;
}

.logout{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:900;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.card{
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:30px;
  padding:22px;
  box-shadow:var(--shadow);
  backdrop-filter: blur(18px);
}

.card h2{
  margin-bottom:18px;
}

label{
  display:block;
  color:var(--muted);
  font-size:14px;
  margin-bottom:8px;
}

input, textarea, select{
  width:100%;
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(184,255,122,0.36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(184,255,122,0.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.green{
  background:linear-gradient(135deg, rgba(184,255,122,0.98) 0%, rgba(65,220,255,0.72) 100%);
  color:#071820;
  box-shadow:0 22px 70px rgba(184,255,122,0.14);
}

.dark{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
}
.logout:hover,.dark:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,0.18);
  box-shadow:var(--shadowSm);
}
.green:hover{
  transform:translateY(-1px);
  box-shadow:0 26px 70px rgba(184,255,122,0.18);
}
.logout:active,.dark:active,.green:active{transform:translateY(0)}

.row{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-top:1px solid rgba(255,255,255,0.08);
  color:#d7e6eb;
}

.row strong{
  color:var(--text);
}

.msg{
  color:var(--muted);
  margin-top:14px;
}

@media(max-width:900px){
  body{display:block}
  .sidebar{width:100%;height:auto;position:relative}
  .main{padding:24px}
  .main > *{max-width:none}
  .grid{grid-template-columns:1fr}
  .top{flex-direction:column;align-items:flex-start;gap:16px}
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">AI <span>FLOW</span></div>

  <div class="menu">
    <a href="/dashboard">Dashboard</a>
    <a href="/leads-page">Leads</a>
    <a href="/content-factory">Content Factory</a>
    <a href="/social-accounts">Social Accounts</a>
    <a href="/ai-replies">AI Replies</a>
    <a href="/analytics">Analytics</a>
    <a href="/calendar">Calendar</a>
    <a href="/billing">Billing</a>
    <a href="/settings" class="active">Settings</a>
  </div>
</div>

<div class="main">

  <div class="top">
    <div>
      <h1>Settings</h1>
      <div class="sub">Manage company profile, AI behavior and notification preferences.</div>
    </div>

    <div class="user">
      <div id="clientEmail">Client</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <h2>Company Profile</h2>

      <label>Company Name</label>
      <input id="companyName" placeholder="My Business">

      <label>Industry</label>
      <select id="industry">
        <!-- Legacy options for backward compatibility with older saved values -->
        <option style="display:none">Restaurant</option>
        <option style="display:none">Fitness</option>
        <option style="display:none">Agency</option>

        <option>Beauty / Salon</option>
        <option>Real Estate</option>
        <option>Restaurant / Cafe</option>
        <option>Fitness / Gym</option>
        <option>Medical / Clinic</option>
        <option>Dental</option>
        <option>Legal / Law Firm</option>
        <option>Accounting / Tax</option>
        <option>Insurance</option>
        <option>Finance / Investment</option>
        <option>Automotive</option>
        <option>Home Services</option>
        <option>Construction</option>
        <option>Cleaning Services</option>
        <option>Plumbing</option>
        <option>Electrical</option>
        <option>HVAC</option>
        <option>Landscaping</option>
        <option>Pest Control</option>
        <option>Roofing</option>
        <option>Moving Company</option>
        <option>E-commerce</option>
        <option>Retail Store</option>
        <option>Fashion / Apparel</option>
        <option>Jewelry</option>
        <option>Education</option>
        <option>Online Courses</option>
        <option>Coaching / Consulting</option>
        <option>Marketing Agency</option>
        <option>Creative Agency</option>
        <option>SaaS / Tech</option>
        <option>IT Services</option>
        <option>Cybersecurity</option>
        <option>Recruiting / Staffing</option>
        <option>Travel / Hospitality</option>
        <option>Hotel / Airbnb</option>
        <option>Events / Wedding</option>
        <option>Photography / Videography</option>
        <option>Entertainment</option>
        <option>Nonprofit</option>
        <option>Government / Public Sector</option>
        <option>Corporate / Enterprise</option>
        <option>Manufacturing</option>
        <option>Logistics / Transportation</option>
        <option>Health & Wellness</option>
        <option>Spa / Med Spa</option>
        <option>Pet Services</option>
        <option>Childcare</option>
        <option>Senior Care</option>
        <option>Food & Beverage</option>
        <option>Professional Services</option>
        <option>Local Services</option>
        <option>Other</option>
      </select>

      <label>Website</label>
      <input id="website" placeholder="https://example.com">

      <label>Business Phone</label>
      <input id="businessPhone" placeholder="+1 555 000 000">

      <button class="green" onclick="saveSettings()">Save Profile</button>

      <div id="profileMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>AI Assistant Settings</h2>

      <label>Assistant Name</label>
      <input id="assistantName" placeholder="AI FLOW Assistant">

      <label>AI Tone</label>
      <select id="aiTone">
        <option>Friendly</option>
        <option>Professional</option>
        <option>Direct Sales</option>
        <option>Luxury Brand</option>
        <option>Casual</option>
      </select>

      <label>AI Goal</label>
      <select id="aiGoal">
        <option>Capture leads</option>
        <option>Book appointments</option>
        <option>Answer questions</option>
        <option>Sell services</option>
        <option>Qualify prospects</option>
      </select>

      <label>Welcome Message</label>
      <textarea id="welcomeMessage" placeholder="Hi! How can I help you today?"></textarea>

      <label>Lead Question</label>
      <input id="leadQuestion" placeholder="What is the best phone number or email to contact you?">

      <label>Business Description</label>
      <textarea id="businessDescription" placeholder="Describe what the business does, services, prices and ideal customer..."></textarea>

      <button class="green" onclick="saveSettings()">Save AI Settings</button>

      <div id="aiMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Notifications</h2>

      <label>Email Notifications</label>
      <select id="emailNotifications">
        <option>Enabled</option>
        <option>Disabled</option>
      </select>

      <label>New Lead Alerts</label>
      <select id="leadAlerts">
        <option>Enabled</option>
        <option>Disabled</option>
      </select>

      <label>Weekly Reports</label>
      <select id="weeklyReports">
        <option>Enabled</option>
        <option>Disabled</option>
      </select>

      <button class="green" onclick="saveSettings()">Save Notifications</button>

      <div id="notifyMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>Workspace Info</h2>

      <div class="row">
        <span>Email</span>
        <strong id="workspaceEmail">—</strong>
      </div>

      <div class="row">
        <span>Company ID</span>
        <strong id="workspaceCompany">—</strong>
      </div>

      <div class="row">
        <span>Plan</span>
        <strong id="workspacePlan">—</strong>
      </div>

      <div class="row">
        <span>Status</span>
        <strong id="workspaceStatus" style="color:#4ade80;">—</strong>
      </div>

      <button class="dark" onclick="resetSettings()" style="margin-top:18px;">Reset Demo Settings</button>

      <div id="workspaceMsg" class="msg"></div>
    </div>

  </div>

</div>

<script>
const email = localStorage.getItem("ai_flow_email");
const companyId = localStorage.getItem("ai_flow_company_id");

if (!email || !companyId) {
  window.location.href = "/login";
}

document.getElementById("clientEmail").innerText = email;
document.getElementById("workspaceEmail").innerText = email;
document.getElementById("workspaceCompany").innerText = companyId;

function logout(){
  localStorage.removeItem("ai_flow_email");
  localStorage.removeItem("ai_flow_role");
  localStorage.removeItem("ai_flow_company_id");
  window.location.href = "/login";
}

function setAllMsgs(text){
  document.getElementById("profileMsg").innerText = text;
  document.getElementById("aiMsg").innerText = text;
  document.getElementById("notifyMsg").innerText = text;
}

async function saveSettings(){
  setAllMsgs("Saving settings...");

  const payload = {
    companyId: companyId,
    companyName: document.getElementById("companyName").value,
    industry: document.getElementById("industry").value,
    website: document.getElementById("website").value,
    phone: document.getElementById("businessPhone").value,
    assistantName: document.getElementById("assistantName").value,
    aiTone: document.getElementById("aiTone").value,
    aiGoal: document.getElementById("aiGoal").value,
    businessDescription: document.getElementById("businessDescription").value,
    welcomeMessage: document.getElementById("welcomeMessage").value,
    leadQuestion: document.getElementById("leadQuestion").value,
    emailNotifications: document.getElementById("emailNotifications").value,
    leadAlerts: document.getElementById("leadAlerts").value,
    weeklyReports: document.getElementById("weeklyReports").value
  };

  try{
    const res = await fetch("/save-settings", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data = await res.json();
    if(!res.ok || data.error){
      setAllMsgs(data.error || "Save settings error.");
      return;
    }

    document.getElementById("profileMsg").innerText = "Profile saved.";
    document.getElementById("aiMsg").innerText = "AI settings saved.";
    document.getElementById("notifyMsg").innerText = "Notifications saved.";
    document.getElementById("workspaceMsg").innerText = "Settings saved to PostgreSQL.";

    loadSettings();
  }catch(e){
    setAllMsgs("Connection error saving settings.");
  }
}

async function loadSettings(){
  try{
    const res = await fetch("/settings-data?companyId=" + encodeURIComponent(companyId));
    const data = await res.json();
    if(!res.ok || data.error){
      document.getElementById("workspaceMsg").innerText = data.error || "Settings load error.";
      return;
    }

    const company = data.company || {};
    const s = data.settings || {};

    document.getElementById("companyName").value = company.company_name || "";
    document.getElementById("industry").value = s.industry || "Beauty / Salon";
    document.getElementById("website").value = s.website || "";
    document.getElementById("businessPhone").value = s.phone || "";

    document.getElementById("assistantName").value = s.assistantName || "AI FLOW Assistant";
    document.getElementById("aiTone").value = s.aiTone || "Friendly";
    document.getElementById("aiGoal").value = s.aiGoal || "Capture leads";
    document.getElementById("welcomeMessage").value = s.welcomeMessage || "Hi! How can I help you today?";
    document.getElementById("leadQuestion").value = s.leadQuestion || "What is the best phone number or email to contact you?";
    document.getElementById("businessDescription").value = s.businessDescription || "";

    document.getElementById("emailNotifications").value = s.emailNotifications || "Enabled";
    document.getElementById("leadAlerts").value = s.leadAlerts || "Enabled";
    document.getElementById("weeklyReports").value = s.weeklyReports || "Enabled";

    document.getElementById("workspacePlan").innerText = company.plan || "Growth Studio";
    document.getElementById("workspaceStatus").innerText = (company.status || "active").toUpperCase();

  }catch(e){
    document.getElementById("workspaceMsg").innerText = "Connection error loading settings.";
  }
}

function resetSettings(){
  document.getElementById("companyName").value = "";
  document.getElementById("industry").value = "Beauty / Salon";
  document.getElementById("website").value = "";
  document.getElementById("businessPhone").value = "";
  document.getElementById("assistantName").value = "AI FLOW Assistant";
  document.getElementById("aiTone").value = "Friendly";
  document.getElementById("aiGoal").value = "Capture leads";
  document.getElementById("businessDescription").value = "";
  document.getElementById("welcomeMessage").value = "Hi! How can I help you today?";
  document.getElementById("leadQuestion").value = "What is the best phone number or email to contact you?";
  document.getElementById("emailNotifications").value = "Enabled";
  document.getElementById("leadAlerts").value = "Enabled";
  document.getElementById("weeklyReports").value = "Enabled";

  document.getElementById("workspaceMsg").innerText = "Defaults loaded. Click Save to persist.";
}

loadSettings();
</script>

<script>
(function(){
  try{
    const companyId = localStorage.getItem("ai_flow_company_id");
    if(!companyId) return;
    if(document.querySelector('script[src="/widget.js"], script[src$="/widget.js"], script[src*="widget.js"]')) return;
    const script = document.createElement("script");
    script.src = "/widget.js";
    script.setAttribute("data-company-id", companyId);
    document.body.appendChild(script);
  }catch(e){}
})();
</script>

</body>
</html>
