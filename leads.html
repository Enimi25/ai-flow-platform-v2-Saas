<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Leads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#050816;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#0b1023;
  border-right:1px solid rgba(255,255,255,.08);
  padding:30px 20px;
}

.logo{
  font-size:28px;
  font-weight:900;
  margin-bottom:50px;
}

.logo span{color:#4ade80}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
  color:#cbd5e1;
  padding:14px 18px;
  border-radius:14px;
  font-size:16px;
}

.menu a:hover{
  background:#111936;
  color:white;
}

.menu .active{
  background:#4ade80;
  color:#020617;
  font-weight:900;
}

.main{
  flex:1;
  padding:40px;
  overflow-y:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}

h1{
  font-size:38px;
  margin-bottom:10px;
}

.sub{
  color:#94a3b8;
  font-size:16px;
}

.user{
  display:flex;
  align-items:center;
  gap:14px;
}

.user-email{
  font-weight:800;
}

.logout{
  background:#1e293b;
  color:white;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:800;
}

.actions{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
}

.green{
  background:#4ade80;
  color:#020617;
}

.dark{
  background:#1e293b;
  color:white;
  border:1px solid rgba(255,255,255,.1);
}

.msg{
  color:#94a3b8;
  margin-bottom:18px;
}

.card{
  background:#0f172a;
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:24px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
  margin-bottom:24px;
}

.stat{
  background:#111936;
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  padding:22px;
}

.stat-title{
  color:#94a3b8;
  margin-bottom:10px;
}

.stat-value{
  font-size:32px;
  font-weight:900;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  color:#94a3b8;
  padding:14px 0;
  font-size:14px;
}

td{
  padding:16px 0;
  border-top:1px solid rgba(255,255,255,.06);
  font-size:14px;
  vertical-align:top;
}

.status{
  padding:7px 10px;
  border-radius:999px;
  font-weight:900;
  font-size:12px;
  display:inline-block;
}

.new{background:#14532d;color:#4ade80}
.in_progress{background:#3b0764;color:#c084fc}
.converted{background:#1e3a8a;color:#60a5fa}

.empty{
  color:#94a3b8;
    padding:18px 0;
}

@media(max-width:900px){
  body{display:block}
  .sidebar{width:100%}
  .main{padding:24px}
  .top{flex-direction:column;align-items:flex-start;gap:16px}
  table{font-size:13px}
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">AI <span>FLOW</span></div>

  <div class="menu">
    <a href="/dashboard">Dashboard</a>
    <a href="/leads-page" class="active">Leads</a>
    <a href="/content-factory">Content Factory</a>
    <a href="/social-accounts">Social Accounts</a>
    <a href="/ai-replies">AI Replies</a>
    <a href="/analytics">Analytics</a>
    <a href="/calendar">Calendar</a>
    <a href="/billing">Billing</a>
    <a href="/settings">Settings</a>
  </div>
</div>

<div class="main">

  <div class="top">
    <div>
      <h1>Leads</h1>
      <div class="sub">View and manage customer leads captured by AI FLOW.</div>
    </div>

    <div class="user">
      <div id="clientEmail" class="user-email">Client</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="actions">
    <button class="green" onclick="loadLeads()">Refresh Leads</button>
    <button class="dark" onclick="createDemoData()">Load Demo Leads</button>
  </div>

  <div id="msg" class="msg">Loading leads...</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-title">Total Leads</div>
      <div class="stat-value" id="totalLeads">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">New</div>
      <div class="stat-value" id="newLeads">0</div>
    </div>

    <div class="stat">
  <div class="stat-title">In Progress</div>
  <div class="stat-value" id="progressLeads">0</div>
  </div>

    <div class="stat">
      <div class="stat-title">Converted</div>
      <div class="stat-value" id="convertedLeads">0</div>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Source</th>
          <th>Status</th>
          <th>Message</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="leadsBody">
        <tr>
          <td colspan="7" class="empty">No leads yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const email = localStorage.getItem("ai_flow_email");
const companyId = localStorage.getItem("ai_flow_company_id");

if (!email || !companyId) {
  window.location.href = "/login";
}

document.getElementById("clientEmail").innerText = email;

function logout(){
  localStorage.removeItem("ai_flow_email");
  localStorage.removeItem("ai_flow_role");
  localStorage.removeItem("ai_flow_company_id");
  window.location.href = "/login";
}

function setMsg(text){
  document.getElementById("msg").innerText = text;
}

function statusClass(status){
  if(status === "in_progress") return "in_progress";
  if(status === "converted") return "converted";
  return "new";
}

function shortDate(value){
  if(!value) return "";
  return value.split("T")[0];
}

function updateStats(leads){
  const total = leads.length;
  const fresh = leads.filter(l => l.status === "new").length;
  const progress = leads.filter(l => l.status === "in_progress").length;
  const converted = leads.filter(l => l.status === "converted").length;

  document.getElementById("totalLeads").innerText = total;
  document.getElementById("newLeads").innerText = fresh;
  document.getElementById("progressLeads").innerText = progress;
  document.getElementById("convertedLeads").innerText = converted;
}

function renderLeads(leads){
  const body = document.getElementById("leadsBody");
  body.innerHTML = "";

  if(!leads.length){
    body.innerHTML = '<tr><td colspan="7" class="empty">No leads yet. Click Load Demo Leads.</td></tr>';
    updateStats([]);
    return;
  }

  leads.forEach(lead => {
    const status = lead.status || "new";
    const tr = document.createElement("tr");

    tr.innerHTML = `
            <td>${lead.name || "Unknown"}</td>
      <td>${lead.email || ""}</td>
      <td>${lead.phone || ""}</td>
      <td>${lead.source || ""}</td>
      <td><span class="status ${statusClass(status)}">${status}</span></td>
      <td>${lead.message || ""}</td>
      <td>${shortDate(lead.created_at)}</td>
    `;

    body.appendChild(tr);
  });

  updateStats(leads);
}

async function loadLeads(){
  setMsg("Loading leads...");

  try{
    const res = await fetch("/dashboard-data?companyId=" + encodeURIComponent(companyId));
    const data = await res.json();

    if(!res.ok || data.error){
      setMsg(data.error || "Leads error.");
      return;
    }

    renderLeads(data.leads || []);
    setMsg("Leads updated.");

  }catch(e){
    setMsg("Connection error loading leads.");
  }
}

async function createDemoData(){
  setMsg("Creating demo leads...");

  try{
    const res = await fetch("/create-demo-data", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({companyId:companyId})
    });

    const data = await res.json();

    if(!res.ok || data.error){
      setMsg(data.error || "Demo data error.");
      return;
    }

    setMsg("Demo leads created.");
    loadLeads();

  }catch(e){
    setMsg("Connection error creating demo leads.");
  }
}

loadLeads();
</script>

</body>
</html>
