<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW AI Replies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#061923;
  --bg2:#040f16;
  --sidebarA:rgba(6, 25, 35, 0.92);
  --panel:rgba(255,255,255,0.06);
  --panel2:rgba(255,255,255,0.04);
  --text:#f7fbff;
  --muted:#9fb7c3;
  --border:rgba(255,255,255,0.12);
  --border2:rgba(255,255,255,0.08);
  --accent:#b8ff7a;
  --accent2:#41dcff;
  --shadow:0 30px 80px rgba(0,0,0,.16);
  --shadowSm:0 18px 50px rgba(0,0,0,.18);
}
body{
  background:
    radial-gradient(980px 720px at 14% -10%, rgba(184,255,122,0.18), transparent 58%),
    radial-gradient(900px 700px at 110% 10%, rgba(65,220,255,0.14), transparent 55%),
    radial-gradient(760px 640px at 70% 120%, rgba(139,92,246,0.10), transparent 58%),
    var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
  line-height:1.4;
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:260px;
  background:linear-gradient(180deg, rgba(6, 25, 35, 0.92) 0%, rgba(4, 15, 22, 0.98) 100%);
  backdrop-filter: blur(18px);
  border-right:1px solid var(--border);
  padding:26px 18px;
  height:100vh;
  position:sticky;
  top:0;
  overflow:auto;
}
.logo{
  font-size:26px;
  font-weight:950;
  margin-bottom:22px;
  letter-spacing:.2px;
}
.logo span{color:var(--accent)}
.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:6px;
}
.menu a{
  text-decoration:none;
  color:#d7e6eb;
  padding:12px 12px;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease;
}
.menu a:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.12);
  color:var(--text);
}
.menu .active{
  background:linear-gradient(135deg, rgba(184,255,122,0.95) 0%, rgba(65,220,255,0.72) 100%);
  color:#071820;
  font-weight:900;
  border-color:rgba(0,0,0,.12);
  box-shadow:0 20px 60px rgba(184,255,122,0.16);
}
.main{
  flex:1;
  padding:32px 28px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.main > *{
  width:100%;
  max-width:1160px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}
h1{
  font-size:38px;
  margin-bottom:10px;
}
.sub{
  color:var(--muted);
  font-size:16px;
}
.user{
  display:flex;
  align-items:center;
  gap:14px;
}
.logout{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:900;
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.logout:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,0.18);
  box-shadow:var(--shadowSm);
}
.logout:active{transform:translateY(0)}

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
}
.card{
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:30px;
  padding:22px;
  box-shadow:var(--shadow);
  backdrop-filter: blur(18px);
}
.card h2{margin-bottom:16px}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  margin:12px 0 8px;
}
input, textarea, select{
  width:100%;
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:12px 14px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus, textarea:focus, select:focus{
  border-color:rgba(184,255,122,0.36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(184,255,122,0.12);
}
textarea{min-height:120px; resize:vertical}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.actions button{flex:1}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.green{
  background:linear-gradient(135deg, rgba(184,255,122,0.98) 0%, rgba(65,220,255,0.72) 100%);
  color:#071820;
  box-shadow:0 22px 70px rgba(184,255,122,0.14);
}
.dark{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:none;
}
.danger{
  background:rgba(127,29,29,.45);
  color:#fecaca;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:none;
}
.green:hover{transform:translateY(-1px); box-shadow:0 26px 70px rgba(184,255,122,0.18)}
.dark:hover,.danger:hover{transform:translateY(-1px); border-color:rgba(255,255,255,0.18); box-shadow:var(--shadowSm)}
.green:active,.dark:active,.danger:active{transform:translateY(0)}

.msg{
  margin-top:14px;
  color:var(--muted);
  line-height:1.4;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.count{
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:#d7e6eb;
  font-weight:900;
  font-size:12px;
}

.empty{
  color:var(--muted);
  line-height:1.5;
  padding:10px 0;
}

.reply-card{
  background:var(--panel2);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:26px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.16);
  backdrop-filter: blur(18px);
}
.reply-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.reply-name{
  font-size:16px;
  font-weight:950;
}
.pills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}
.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  border:1px solid rgba(255,255,255,.10);
}
.pill.source{
  background:#14532d;
  color:#4ade80;
  border-color:rgba(74,222,128,.18);
}
.pill.status{
  background:rgba(30,41,59,.80);
  color:#cbd5e1;
}
.meta{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}
.bubbles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.bubble{
  background:rgba(2,6,23,.55);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:14px;
}
.bubble-title{
  font-weight:950;
  font-size:12px;
  margin-bottom:8px;
  color:#cbd5e1;
}
.bubble.customer{border-left:4px solid #60a5fa}
.bubble.ai{border-left:4px solid #4ade80}
.bubble p{
  color:#e2e8f0;
  font-size:13px;
  line-height:1.5;
}
.reply-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
  margin-top:12px;
}
.mini{
  padding:9px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:950;
  box-shadow:none;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(30,41,59,.72);
  color:#e2e8f0;
}
.mini.active{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
  color:#03140a;
  border-color:rgba(0,0,0,.12);
}
.mini.danger{
  background:rgba(127,29,29,.45);
  color:#fecaca;
}
.mini:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadowSm);
  border-color:rgba(255,255,255,.16);
}
.mini:active{transform:translateY(0)}

@media(max-width:1050px){
  .bubbles{grid-template-columns:1fr}
}
@media(max-width:900px){
  body{display:block}
  .sidebar{width:100%;height:auto;position:relative}
  .main{padding:24px}
  .main > *{max-width:none}
  .grid{grid-template-columns:1fr}
  .top{flex-direction:column;align-items:flex-start;gap:16px}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">AI <span>FLOW</span></div>
  <div class="menu">
    <a href="/dashboard">Dashboard</a>
    <a href="/leads-page">Leads</a>
    <a href="/content-factory">Content Factory</a>
    <a href="/social-accounts">Social Accounts</a>
    <a href="/ai-replies" class="active">AI Replies</a>
    <a href="/analytics">Analytics</a>
    <a href="/calendar">Calendar</a>
    <a href="/billing">Billing</a>
    <a href="/settings">Settings</a>
  </div>
</div>

<div class="main">
  <div class="top">
    <div>
      <h1>AI Replies Inbox</h1>
      <div class="sub">Generate replies, review the inbox and manage statuses.</div>
    </div>
    <div class="user">
      <div id="clientEmail">Client</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Generate Reply</h2>
      <label>Customer Name</label>
      <input id="customerName" placeholder="John Smith">
      <label>Source</label>
      <select id="source">
        <option>Website</option>
        <option>Instagram</option>
        <option>Facebook</option>
        <option>WhatsApp</option>
      </select>
      <label>Customer Message</label>
      <textarea id="customerMessage" placeholder="Type a customer message to generate an AI reply..."></textarea>
      <div class="actions">
        <button class="green" onclick="generateReply()">Generate Reply</button>
        <button class="dark" onclick="loadDemoReplies()">Load Demo</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>

    <div class="card">
      <div class="header-row">
        <h2 style="margin:0;">Inbox</h2>
        <div class="count" id="countLabel">0</div>
      </div>
      <div id="repliesBody">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
const email = localStorage.getItem("ai_flow_email");
const companyId = localStorage.getItem("ai_flow_company_id");
const role = localStorage.getItem("ai_flow_role") || "";

if (!email || (!companyId && role !== "platform_admin")) {
  window.location.href = "/login";
}

document.getElementById("clientEmail").innerText = email;

function logout(){
  try{ fetch("/logout-api", {method:"POST", credentials:"same-origin"}); }catch(e){}
  localStorage.removeItem("ai_flow_email");
  localStorage.removeItem("ai_flow_role");
  localStorage.removeItem("ai_flow_company_id");
  window.location.href = "/login";
}

let replies = [];

function setMsg(text){
  document.getElementById("msg").innerText = text;
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll("\"","&quot;")
    .replaceAll("'","&#039;");
}

function shortDate(iso){
  const s = String(iso || "");
  if(!s) return "—";
  return s.split("T")[0] || s.slice(0, 10) || "—";
}

async function loadReplies(){
  try{
    const res = await fetch("/replies-data?companyId=" + encodeURIComponent(companyId));
    const data = await res.json();

    if(!res.ok || data.error){
      document.getElementById("repliesBody").innerHTML = '<div class="empty">' + escapeHtml(data.error || "Replies error.") + '</div>';
      return;
    }

    replies = data.replies || [];
    document.getElementById("countLabel").innerText = String(replies.length);
    renderReplies();
  }catch(e){
    document.getElementById("repliesBody").innerHTML = '<div class="empty">Connection error loading replies.</div>';
  }
}

function renderReplies(){
  const body = document.getElementById("repliesBody");
  body.innerHTML = "";

  if(!replies.length){
    body.innerHTML = '<div class="empty">No replies yet. Generate one on the left or load demo.</div>';
    return;
  }

  replies.forEach(item => {
    const div = document.createElement("div");
    div.className = "reply-card";

    const name = item.customer_name || "Customer";
    const source = item.source || "Website";
    const status = item.status || "draft";
    const createdAt = item.created_at || "";

    div.innerHTML = `
      <div class="reply-top">
        <div>
          <div class="reply-name">${escapeHtml(name)}</div>
          <div class="pills">
            <span class="pill source">${escapeHtml(source)}</span>
            <span class="pill status">${escapeHtml(status)}</span>
            <span class="meta">${escapeHtml(shortDate(createdAt))}</span>
          </div>
        </div>
      </div>

      <div class="bubbles">
        <div class="bubble customer">
          <div class="bubble-title">Customer Message</div>
          <p>${escapeHtml(item.customer_message || "—")}</p>
        </div>
        <div class="bubble ai">
          <div class="bubble-title">AI Reply</div>
          <p>${escapeHtml(item.ai_reply || "—")}</p>
        </div>
      </div>

      <div class="reply-actions">
        <button class="mini ${status === "draft" ? "active" : ""}" onclick="updateStatus(${item.id}, 'draft')">Draft</button>
        <button class="mini ${status === "sent" ? "active" : ""}" onclick="updateStatus(${item.id}, 'sent')">Sent</button>
        <button class="mini ${status === "archived" ? "active" : ""}" onclick="updateStatus(${item.id}, 'archived')">Archive</button>
        <button class="mini danger" onclick="deleteReply(${item.id})">Delete</button>
      </div>
    `;

    body.appendChild(div);
  });
}

async function generateReply(){
  const customerName = document.getElementById("customerName").value.trim();
  const source = document.getElementById("source").value;
  const customerMessage = document.getElementById("customerMessage").value.trim();

  if(!customerMessage){
    setMsg("Enter customer message first.");
    return;
  }

  setMsg("Generating reply...");

  try{
    const res = await fetch("/create-ai-reply", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        customerName: customerName,
        customerMessage: customerMessage,
        source: source
      })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Create reply error.");
      return;
    }

    document.getElementById("customerName").value = "";
    document.getElementById("customerMessage").value = "";

    setMsg("Reply created.");
    await loadReplies();
  }catch(e){
    setMsg("Connection error creating reply.");
  }
}

async function loadDemoReplies(){
  setMsg("Creating demo replies...");
  const demos = [
    {
      customerName:"Michael Johnson",
      source:"Instagram",
      customerMessage:"Hi, I run a beauty salon. Can AI FLOW answer Instagram messages and book appointments?"
    },
    {
      customerName:"Sarah Williams",
      source:"Website",
      customerMessage:"Can I see pricing for website chatbot?"
    },
    {
      customerName:"David Miller",
      source:"Facebook",
      customerMessage:"I want to book a demo call tomorrow."
    }
  ];

  try{
    for(const item of demos){
      const res = await fetch("/create-ai-reply", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          companyId: companyId,
          customerName: item.customerName,
          customerMessage: item.customerMessage,
          source: item.source
        })
      });
      const data = await res.json();
      if(!res.ok || data.error){
        setMsg(data.error || "Demo create error.");
        return;
      }
    }

    setMsg("Demo replies created.");
    await loadReplies();
  }catch(e){
    setMsg("Connection error creating demo replies.");
  }
}

async function updateStatus(id, status){
  setMsg("Updating status...");

  try{
    const res = await fetch("/update-reply-status", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        id: id,
        status: status
      })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Update status error.");
      return;
    }

    setMsg("Status updated.");
    await loadReplies();
  }catch(e){
    setMsg("Connection error updating status.");
  }
}

async function deleteReply(id){
  if(!confirm("Delete this reply?")) return;
  setMsg("Deleting reply...");

  try{
    const res = await fetch("/delete-reply", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        id: id
      })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Delete reply error.");
      return;
    }

    setMsg("Reply deleted.");
    await loadReplies();
  }catch(e){
    setMsg("Connection error deleting reply.");
  }
}

loadReplies();
</script>

<script>
(function(){
  try{
    const companyId = localStorage.getItem("ai_flow_company_id");
    if(!companyId) return;
    if(document.querySelector('script[src="/widget.js"], script[src$="/widget.js"], script[src*="widget.js"]')) return;
    const script = document.createElement("script");
    script.src = "/widget.js";
    script.setAttribute("data-company-id", companyId);
    document.body.appendChild(script);
  }catch(e){}
})();
</script>

</body>
</html>
