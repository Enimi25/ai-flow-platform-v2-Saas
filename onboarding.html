<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI FLOW Onboarding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#061923;
      --bg2:#040f16;
      --panel:rgba(255,255,255,0.06);
      --panel2:rgba(255,255,255,0.04);
      --text:#f7fbff;
      --muted:#9fb7c3;
      --border:rgba(255,255,255,0.12);
      --border2:rgba(255,255,255,0.08);
      --accent:#b8ff7a;
      --accent2:#41dcff;
      --shadow:0 30px 80px rgba(0,0,0,.16);
      --shadowSm:0 18px 50px rgba(0,0,0,.18);
    }
    body{
      background:
        radial-gradient(980px 720px at 14% -10%, rgba(184,255,122,0.18), transparent 58%),
        radial-gradient(900px 700px at 110% 10%, rgba(65,220,255,0.14), transparent 55%),
        radial-gradient(760px 640px at 70% 120%, rgba(139,92,246,0.10), transparent 58%),
        var(--bg);
      color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px 18px;
    }
    .wrap{
      width:100%;
      max-width:920px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:32px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(18px);
    }
    .head{
      padding:22px 22px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
    }
    .logo{
      font-size:26px;
      font-weight:950;
      letter-spacing:.2px;
    }
    .logo span{color:var(--accent)}
    h1{
      font-size:22px;
      margin-top:8px;
      letter-spacing:-.2px;
    }
    .sub{color:var(--muted);margin-top:6px;line-height:1.5}
    .pill{
      display:inline-block;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      color:#d7e6eb;
      font-size:12px;
      font-weight:900;
    }
    .body{
      padding:22px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }
    .card{
      background:var(--panel2);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:30px;
      padding:18px;
      backdrop-filter: blur(18px);
    }
    .card h2{
      font-size:16px;
      margin-bottom:14px;
    }
    label{
      display:block;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      margin-bottom:8px;
    }
    input, textarea, select{
      width:100%;
      background:rgba(255,255,255,0.06);
      color:var(--text);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      padding:13px 14px;
      outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      transition:border-color .15s ease, box-shadow .15s ease;
      margin-bottom:14px;
    }
    input:focus, textarea:focus, select:focus{
      border-color:rgba(184,255,122,0.36);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(184,255,122,0.12);
    }
    textarea{min-height:110px;resize:vertical}
    .code{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;
      line-height:1.55;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      padding:14px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .actions{
      grid-column:1/-1;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding-top:4px;
    }
    .btn{
      border:0;
      border-radius:12px;
      padding:13px 16px;
      font-weight:950;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
      white-space:nowrap;
    }
    .green{
      background:linear-gradient(135deg, rgba(184,255,122,0.98) 0%, rgba(65,220,255,0.72) 100%);
      color:#071820;
      box-shadow:0 22px 70px rgba(184,255,122,0.14);
    }
    .dark{
      background:rgba(255,255,255,0.06);
      color:var(--text);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:none;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadowSm)}
    .green:hover{box-shadow:0 26px 70px rgba(184,255,122,0.18)}
    .btn:active{transform:translateY(0)}
    .msg{color:var(--muted)}
    @media(max-width:900px){
      .body{grid-template-columns:1fr}
      .actions{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="logo">AI <span>FLOW</span></div>
        <h1>Workspace Onboarding</h1>
        <div class="sub">Finish setup to personalize your widget and dashboard experience.</div>
      </div>
      <div class="pill" id="companyPill">Company</div>
    </div>

    <div class="body">
      <div class="card">
        <h2>Company</h2>
        <label>Company Name</label>
        <input id="companyName" placeholder="My Business">

        <label>Industry</label>
        <select id="industry">
          <!-- Legacy options for backward compatibility with older saved values -->
          <option style="display:none">Restaurant</option>
          <option style="display:none">Fitness</option>
          <option style="display:none">Agency</option>

          <option>Beauty / Salon</option>
          <option>Real Estate</option>
          <option>Restaurant / Cafe</option>
          <option>Fitness / Gym</option>
          <option>Medical / Clinic</option>
          <option>Dental</option>
          <option>Legal / Law Firm</option>
          <option>Accounting / Tax</option>
          <option>Insurance</option>
          <option>Finance / Investment</option>
          <option>Automotive</option>
          <option>Home Services</option>
          <option>Construction</option>
          <option>Cleaning Services</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>HVAC</option>
          <option>Landscaping</option>
          <option>Pest Control</option>
          <option>Roofing</option>
          <option>Moving Company</option>
          <option>E-commerce</option>
          <option>Retail Store</option>
          <option>Fashion / Apparel</option>
          <option>Jewelry</option>
          <option>Education</option>
          <option>Online Courses</option>
          <option>Coaching / Consulting</option>
          <option>Marketing Agency</option>
          <option>Creative Agency</option>
          <option>SaaS / Tech</option>
          <option>IT Services</option>
          <option>Cybersecurity</option>
          <option>Recruiting / Staffing</option>
          <option>Travel / Hospitality</option>
          <option>Hotel / Airbnb</option>
          <option>Events / Wedding</option>
          <option>Photography / Videography</option>
          <option>Entertainment</option>
          <option>Nonprofit</option>
          <option>Government / Public Sector</option>
          <option>Corporate / Enterprise</option>
          <option>Manufacturing</option>
          <option>Logistics / Transportation</option>
          <option>Health & Wellness</option>
          <option>Spa / Med Spa</option>
          <option>Pet Services</option>
          <option>Childcare</option>
          <option>Senior Care</option>
          <option>Food & Beverage</option>
          <option>Professional Services</option>
          <option>Local Services</option>
          <option>Other</option>
        </select>
      </div>

      <div class="card">
        <h2>Assistant</h2>
        <label>Assistant Name</label>
        <input id="assistantName" placeholder="AI FLOW Assistant">

        <label>Welcome Message</label>
        <textarea id="welcomeMessage" placeholder="Hi! How can I help you today?"></textarea>

        <label>Lead Question</label>
        <input id="leadQuestion" placeholder="What is the best phone number or email to contact you?">
      </div>

      <div class="card" style="grid-column:1/-1;">
        <h2>Website Widget Code</h2>
        <div id="widgetCode" class="code"></div>
        <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
          <button class="btn dark" type="button" onclick="copyWidget()">Copy Widget Code</button>
          <div class="msg" id="copyMsg"></div>
        </div>
      </div>

      <div class="actions">
        <div class="msg" id="msg"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn dark" type="button" onclick="skipToDashboard()">Skip for Now</button>
          <button class="btn green" type="button" onclick="finish()">Finish Setup</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  const email = localStorage.getItem("ai_flow_email");
  const companyId = localStorage.getItem("ai_flow_company_id");
  if(!email || !companyId){
    window.location.href = "/login";
  }

  function setMsg(t){document.getElementById("msg").innerText = t;}
  function setCopy(t){document.getElementById("copyMsg").innerText = t;}

  function widgetSnippet(){
    const src = window.location.origin + "/widget.js";
    return '<script src="' + src + '" data-company-id="' + companyId + '"></' + 'script>';
  }

  function renderWidgetCode(){
    document.getElementById("widgetCode").innerText = widgetSnippet();
  }

  async function copyWidget(){
    try{
      await navigator.clipboard.writeText(widgetSnippet());
      setCopy("Copied.");
      setTimeout(function(){setCopy("");}, 1200);
    }catch(e){
      setCopy("Copy not available in this browser.");
    }
  }

  async function load(){
    renderWidgetCode();
    document.getElementById("companyPill").innerText = "Company: " + companyId;

    setMsg("Loading settings...");
    try{
      const res = await fetch("/settings-data?companyId=" + encodeURIComponent(companyId));
      const data = await res.json();
      if(!res.ok || data.error){
        setMsg(data.error || "Settings load error.");
        return;
      }

      const company = data.company || {};
      const s = data.settings || {};

      document.getElementById("companyName").value = company.company_name || "";
      document.getElementById("industry").value = s.industry || "Beauty / Salon";
      document.getElementById("assistantName").value = s.assistantName || "AI FLOW Assistant";
      document.getElementById("welcomeMessage").value = s.welcomeMessage || "Hi! How can I help you today?";
      document.getElementById("leadQuestion").value = s.leadQuestion || "What is the best phone number or email to contact you?";

      setMsg("");
    }catch(e){
      setMsg("Connection error loading settings.");
    }
  }

  async function finish(){
    const companyName = document.getElementById("companyName").value.trim();
    const industry = document.getElementById("industry").value;
    const assistantName = document.getElementById("assistantName").value.trim();
    const welcomeMessage = document.getElementById("welcomeMessage").value.trim();
    const leadQuestion = document.getElementById("leadQuestion").value.trim();

    if(!companyName){
      setMsg("Enter Company Name to finish setup.");
      return;
    }

    setMsg("Saving settings...");
    try{
      const res = await fetch("/save-settings", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          companyId: companyId,
          companyName: companyName,
          industry: industry,
          assistantName: assistantName,
          welcomeMessage: welcomeMessage,
          leadQuestion: leadQuestion,
          // Keep existing fields default-safe
          aiTone: "Friendly",
          aiGoal: "Capture leads",
          businessDescription: "",
          website: "",
          phone: "",
          emailNotifications: "Enabled",
          leadAlerts: "Enabled",
          weeklyReports: "Enabled"
        })
      });

      const data = await res.json();
      if(!res.ok || data.error){
        setMsg(data.error || "Save error.");
        return;
      }

      window.location.href = "/dashboard";
    }catch(e){
      setMsg("Connection error saving settings.");
    }
  }

  function skipToDashboard(){
    window.location.href = "/dashboard";
  }

  load();
  </script>
</body>
</html>
