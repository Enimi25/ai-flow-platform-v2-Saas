<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050816;
  --bg2:#070b1d;
  --sidebarA:#0b1023;
  --panel:#0f172a;
  --panel2:#111936;
  --input:#020617;
  --text:#ffffff;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.06);
  --accent:#4ade80;
  --accent2:#22c55e;
  --shadow:0 14px 40px rgba(0,0,0,.35);
  --shadowSm:0 8px 22px rgba(0,0,0,.28);
}
body{
  background:
    radial-gradient(1200px 800px at 18% -10%, rgba(74,222,128,.12), transparent 55%),
    radial-gradient(900px 700px at 110% 10%, rgba(96,165,250,.10), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
  line-height:1.4;
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:260px;
  background:linear-gradient(180deg, var(--sidebarA) 0%, var(--bg2) 100%);
  border-right:1px solid var(--border);
  padding:26px 18px;
  height:100vh;
  position:sticky;
  top:0;
  overflow:auto;
}
.logo{
  font-size:26px;
  font-weight:950;
  margin-bottom:22px;
  letter-spacing:.2px;
}
.logo span{color:var(--accent)}
.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:6px;
}
.menu a{
  text-decoration:none;
  color:#cbd5e1;
  padding:12px 12px;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease;
}
.menu a:hover{
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.08);
  color:white;
}
.menu .active{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
  color:#03140a;
  font-weight:900;
  border-color:rgba(0,0,0,.12);
  box-shadow:0 10px 24px rgba(34,197,94,.18);
}
.main{
  flex:1;
  padding:32px 28px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.main > *{
  width:100%;
  max-width:1160px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}
h1{
  font-size:38px;
  margin-bottom:10px;
  letter-spacing:-.2px;
}
.sub{
  color:var(--muted);
  font-size:16px;
}
.user{
  display:flex;
  align-items:center;
  gap:14px;
}
.logout{
  background:rgba(30,41,59,.70);
  color:white;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:900;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
}
.card{
  background:linear-gradient(180deg, rgba(15,23,42,.96) 0%, rgba(15,23,42,.88) 100%);
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
}
.card h2{
  margin-bottom:18px;
}
label{
  display:block;
  color:var(--muted);
  font-size:14px;
  margin-bottom:8px;
}
input, textarea, select{
  width:100%;
  background:rgba(2,6,23,.92);
  color:white;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(74,222,128,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(74,222,128,.12);
}
textarea{
  min-height:100px;
  resize:vertical;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
  color:#03140a;
  box-shadow:0 10px 24px rgba(34,197,94,.18);
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.dark{
  background:rgba(30,41,59,.72);
  color:white;
  border:1px solid rgba(255,255,255,.10);
  margin-top:10px;
  box-shadow:none;
}
.logout:hover,.dark:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.16);
  box-shadow:var(--shadowSm);
}
button:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 34px rgba(34,197,94,.22);
}
.logout:active,.dark:active,button:active{transform:translateY(0)}
.booking{
  background:rgba(17,25,54,.70);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.25);
}
.booking h3{
  margin-bottom:8px;
}
.booking p{
  color:#cbd5e1;
  line-height:1.5;
  font-size:14px;
}
.meta{
  color:#4ade80;
  font-size:12px;
  font-weight:900;
  margin-top:10px;
}
.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#14532d;
  color:#4ade80;
  font-size:12px;
  font-weight:900;
  margin-top:10px;
}

.booking-actions{
  margin-top:12px;
  display:flex;
  justify-content:flex-end;
}
.mini{
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:950;
  box-shadow:none;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(127,29,29,.45);
  color:#fecaca;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.mini:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadowSm);
  border-color:rgba(248,113,113,.30);
}
.mini:active{transform:translateY(0)}
.msg{
  margin-top:14px;
  color:var(--muted);
}
.empty{
  color:var(--muted);
  line-height:1.5;
}


@media(max-width:900px){
  body{display:block}
  .sidebar{width:100%;height:auto;position:relative}
  .main{padding:24px}
  .main > *{max-width:none}
  .grid{grid-template-columns:1fr}
  .top{flex-direction:column;align-items:flex-start;gap:16px}
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">AI <span>FLOW</span></div>
  <div class="menu">
    <a href="/dashboard">Dashboard</a>
    <a href="/leads-page">Leads</a>
    <a href="/content-factory">Content Factory</a>
    <a href="/social-accounts">Social Accounts</a>
    <a href="/ai-replies">AI Replies</a>
    <a href="/analytics">Analytics</a>
    <a href="/calendar" class="active">Calendar</a>
    <a href="/billing">Billing</a>
    <a href="/settings">Settings</a>
  </div>
</div>
<div class="main">
  <div class="top">
    <div>
      <h1>Calendar</h1>
      <div class="sub">Manage demo calls, client appointments and AI-booked meetings.</div>
    </div>
    <div class="user">
      <div id="clientEmail">Client</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Create Booking</h2>
      <label>Client Name</label>
      <input id="clientName" placeholder="John Smith">
      <label>Email</label>
      <input id="bookingEmail" placeholder="client@example.com">
      <label>Phone</label>
      <input id="bookingPhone" placeholder="+1 555 000 000">
      <label>Date</label>
      <input id="bookingDate" type="date">
      <label>Time</label>
      <input id="bookingTime" type="time">
      <label>Meeting Type</label>
      <select id="meetingType">
        <option>AI FLOW Demo Call</option>
        <option>Sales Consultation</option>
        <option>Content Factory Review</option>
        <option>Client Onboarding</option>
      </select>
      <button onclick="createLocalBooking()">Create Booking</button>
      <button class="dark" onclick="loadDemoBookings()">Load Demo Bookings</button>
      <div id="msg" class="msg"></div>
    </div>
    <div class="card">
      <h2>Upcoming Bookings</h2>
      <div id="bookingsBody">
        <div class="empty">No bookings yet. Create a booking or load demo bookings.</div>
      </div>
    </div>
  </div>
</div>
<script>
const email = localStorage.getItem("ai_flow_email");
const companyId = localStorage.getItem("ai_flow_company_id");

if (!email || !companyId) {
  window.location.href = "/login";
}

document.getElementById("clientEmail").innerText = email;

let bookings = [];

function logout(){
  localStorage.removeItem("ai_flow_email");
  localStorage.removeItem("ai_flow_role");
  localStorage.removeItem("ai_flow_company_id");
  window.location.href = "/login";
}

function setMsg(text){
  document.getElementById("msg").innerText = text;
}

async function loadBookings(){
  setMsg("Loading bookings...");

  try{
    const res = await fetch("/bookings-data?companyId=" + encodeURIComponent(companyId));
    const data = await res.json();

    if(!res.ok || data.error){
      setMsg(data.error || "Bookings error.");
      return;
    }

    bookings = data.bookings || [];
    renderBookings();
    setMsg("Bookings updated.");

  }catch(e){
    setMsg("Connection error loading bookings.");
  }
}

async function createLocalBooking(){
  const clientName = document.getElementById("clientName").value.trim();
  const emailValue = document.getElementById("bookingEmail").value.trim();
  const phoneValue = document.getElementById("bookingPhone").value.trim();
  const dateValue = document.getElementById("bookingDate").value;
  const timeValue = document.getElementById("bookingTime").value;
  const meetingType = document.getElementById("meetingType").value;

  if(!clientName || !dateValue || !timeValue){
    setMsg("Enter client name, date and time.");
    return;
  }

  setMsg("Creating booking...");

  try{
    const res = await fetch("/create-booking", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        clientName: clientName,
        email: emailValue,
        phone: phoneValue,
        date: dateValue,
        time: timeValue,
        meetingType: meetingType
      })
    });

    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Create booking error.");
      return;
    }

    document.getElementById("clientName").value = "";
    document.getElementById("bookingEmail").value = "";
    document.getElementById("bookingPhone").value = "";
    document.getElementById("bookingDate").value = "";
    document.getElementById("bookingTime").value = "";

    setMsg("Booking created.");
    loadBookings();

  }catch(e){
    setMsg("Connection error creating booking.");
  }
}

async function loadDemoBookings(){
  setMsg("Creating demo bookings...");

  const demos = [
    {
      clientName:"Michael Johnson",
      email:"michael@example.com",
      phone:"+155500001",
      date:"2026-06-01",
      time:"10:00",
      meetingType:"AI FLOW Demo Call"
    },
    {
      clientName:"Sarah Williams",
      email:"sarah@example.com",
      phone:"+155500002",
      date:"2026-06-02",
      time:"14:30",
      meetingType:"Sales Consultation"
    },
    {
      clientName:"David Miller",
      email:"david@example.com",
      phone:"+155500003",
      date:"2026-06-03",
      time:"16:00",
      meetingType:"Client Onboarding"
    }
  ];

  try{
    for(const item of demos){
      const res = await fetch("/create-booking", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          companyId: companyId,
          clientName: item.clientName,
          email: item.email,
          phone: item.phone,
          date: item.date,
          time: item.time,
          meetingType: item.meetingType
        })
      });

      const data = await res.json();
      if(!res.ok || data.error){
        setMsg(data.error || "Demo booking error.");
        return;
      }
    }

    setMsg("Demo bookings created.");
    loadBookings();

  }catch(e){
    setMsg("Connection error creating demo bookings.");
  }
}

async function deleteBooking(id){
  if(!confirm("Delete this booking?")) return;
  setMsg("Deleting booking...");

  try{
    const res = await fetch("/delete-booking", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        id: id
      })
    });

    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Delete booking error.");
      return;
    }

    setMsg("Booking deleted.");
    loadBookings();

  }catch(e){
    setMsg("Connection error deleting booking.");
  }
}

function renderBookings(){
  const body = document.getElementById("bookingsBody");
  body.innerHTML = "";

  if(!bookings.length){
    body.innerHTML = '<div class="empty">No bookings yet. Create a booking or load demo bookings.</div>';
    return;
  }

  bookings.forEach(item => {
    const div = document.createElement("div");
    div.className = "booking";

    const meetingTime = (item.meeting_time || "").trim();
    const parts = meetingTime.split(" ");
    const dateValue = parts[0] || "";
    const timeValue = parts.slice(1).join(" ") || "";
    const meetingType = item.meeting_link || "Meeting";

    div.innerHTML = `
      <h3>${item.client_name || "Client"}</h3>
      <p>${meetingType}</p>
      <p>Email: ${item.email || "—"}</p>
      <p>Phone: ${item.phone || "—"}</p>
      <div class="meta">${dateValue} ${timeValue ? ("· " + timeValue) : ""}</div>
      <div class="status">${item.status || "booked"}</div>
      <div class="booking-actions">
        <button class="mini" onclick="deleteBooking(${item.id})">Delete</button>
      </div>
    `;

    body.appendChild(div);
  });
}

loadBookings();
</script>

<script>
(function(){
  try{
    const companyId = localStorage.getItem("ai_flow_company_id");
    if(!companyId) return;
    if(document.querySelector('script[src="/widget.js"], script[src$="/widget.js"], script[src*="widget.js"]')) return;
    const script = document.createElement("script");
    script.src = "/widget.js";
    script.setAttribute("data-company-id", companyId);
    document.body.appendChild(script);
  }catch(e){}
})();
</script>

</body>
</html>
