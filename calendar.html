<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#050816;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:260px;
  background:#0b1023;
  border-right:1px solid rgba(255,255,255,.08);
  padding:30px 20px;
}
.logo{
  font-size:28px;
  font-weight:900;
  margin-bottom:50px;
}
.logo span{color:#4ade80}
.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.menu a{
  text-decoration:none;
  color:#cbd5e1;
  padding:14px 18px;
  border-radius:14px;
  font-size:16px;
}
.menu a:hover{
  background:#111936;
  color:white;
}
.menu .active{
  background:#4ade80;
  color:#020617;
  font-weight:900;
}
.main{
  flex:1;
  padding:40px;
  overflow-y:auto;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}
h1{
  font-size:38px;
  margin-bottom:10px;
}
.sub{
  color:#94a3b8;
  font-size:16px;
}
.user{
  display:flex;
  align-items:center;
  gap:14px;
}
.logout{
  background:#1e293b;
  color:white;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:800;
}
.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
}
.card{
  background:#0f172a;
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:24px;
}
.card h2{
  margin-bottom:18px;
}
label{
  display:block;
  color:#94a3b8;
  font-size:14px;
  margin-bottom:8px;
}
input, textarea, select{
  width:100%;
  background:#020617;
  color:white;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  outline:none;
}
textarea{
  min-height:100px;
  resize:vertical;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  background:#4ade80;
  color:#020617;
}
.dark{
  background:#1e293b;
  color:white;
  border:1px solid rgba(255,255,255,.1);
  margin-top:10px;
}
.booking{
  background:#111936;
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.booking h3{
  margin-bottom:8px;
}
.booking p{
  color:#cbd5e1;
  line-height:1.5;
  font-size:14px;
}
.meta{
  color:#4ade80;
  font-size:12px;
  font-weight:900;
  margin-top:10px;
}
.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#14532d;
  color:#4ade80;
  font-size:12px;
  font-weight:900;
  margin-top:10px;
}
.msg{
  margin-top:14px;
  color:#94a3b8;
}
.empty{
  color:#94a3b8;
  line-height:1.5;
}
