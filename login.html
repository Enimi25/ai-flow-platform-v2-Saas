<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/media/brand/ai-flow-app-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(980px 720px at 14% -10%, rgba(184,255,122,0.18), transparent 58%),
    radial-gradient(900px 700px at 110% 10%, rgba(65,220,255,0.14), transparent 55%),
    radial-gradient(760px 640px at 70% 120%, rgba(139,92,246,0.10), transparent 58%),
    #061923;
  color:#f7fbff;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}
.box{
  width:420px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:32px;
  padding:36px;
  box-shadow:0 30px 80px rgba(0,0,0,.16);
  backdrop-filter: blur(18px);
}
.logo{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:900;margin-bottom:12px}
.logo img{width:54px;height:54px;border-radius:17px;object-fit:cover;box-shadow:0 16px 42px rgba(65,220,255,.2)}
.logo span{color:#b8ff7a}
.sub{color:#9fb7c3;margin-bottom:26px;line-height:1.5}
label{display:block;margin-bottom:8px;color:#d7e6eb;font-size:14px;font-weight:800}
input{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.06);
  color:#f7fbff;
  font-size:15px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
}
input:focus{
  border-color:rgba(184,255,122,0.36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 0 0 3px rgba(184,255,122,0.12);
}
.btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
  margin-bottom:12px;
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.login{
  background:linear-gradient(135deg, rgba(184,255,122,0.98) 0%, rgba(65,220,255,0.72) 100%);
  color:#071820;
  box-shadow:0 22px 70px rgba(184,255,122,0.14);
}
.register{
  background:rgba(255,255,255,0.06);
  color:#f7fbff;
  border:1px solid rgba(255,255,255,0.12);
}
.google{
  background:#fff;
  color:#17202a;
  border:1px solid rgba(255,255,255,0.2);
}
.divider{display:flex;align-items:center;gap:12px;color:#9fb7c3;margin:8px 0 16px;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.12)}
.btn:hover{transform:translateY(-1px)}
.login:hover{box-shadow:0 26px 70px rgba(184,255,122,0.18)}
.register:hover{box-shadow:0 18px 50px rgba(0,0,0,0.18)}
.btn:active{transform:translateY(0)}
.msg{margin-top:12px;color:#9fb7c3;min-height:22px}
.error{color:#fb7185}
.success{color:#b8ff7a}
</style>
</head>

<body>

<div class="box">
  <div class="logo"><img src="/media/brand/ai-flow-app-icon.png" alt="AI FLOW logo"><span style="color:#f7fbff">AI <span>FLOW</span></span></div>
  <div class="sub">Login or create an account to access your AI sales dashboard.</div>

  <label>Email</label>
  <input id="email" type="email" placeholder="client@example.com">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <button class="btn login" id="loginBtn">Login</button>
  <button class="btn register" id="registerBtn">Create New Account</button>
  <div class="divider">or</div>
  <button class="btn google" id="googleBtn">Continue with Google + Calendar</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const msg = document.getElementById("msg");

function getValues(){
  return {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value.trim()
  };
}

async function registerUser(){
  const data = getValues();

  msg.className = "msg";
  msg.innerText = "Creating account...";

  if(!data.email || !data.password){
    msg.className = "msg error";
    msg.innerText = "Enter email and password.";
    return;
  }

  try{
    const res = await fetch("/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const result = await res.json();

    if(!res.ok || result.error){
      msg.className = "msg error";
      msg.innerText = result.error || "Register error.";
      return;
    }

    msg.className = "msg success";
    msg.innerText = "Account created. Now click Login.";
  }catch(e){
    msg.className = "msg error";
    msg.innerText = "Connection error.";
  }
}

async function loginUser(){
  const data = getValues();

  msg.className = "msg";
  msg.innerText = "Logging in...";

  if(!data.email || !data.password){
    msg.className = "msg error";
    msg.innerText = "Enter email and password.";
    return;
  }

  try{
    const res = await fetch("/login-api",{
      method:"POST",
      credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const result = await res.json();

    if(!res.ok || result.error){
      msg.className = "msg error";
      msg.innerText = result.error || "Login error.";
      return;
    }

    localStorage.setItem("ai_flow_email", result.email);
    localStorage.setItem("ai_flow_role", result.role);
    if(result.companyId){
      localStorage.setItem("ai_flow_company_id", result.companyId);
    }else{
      localStorage.removeItem("ai_flow_company_id");
    }

    if(result.role === "platform_admin"){
      window.location.href = "/admin";
      return;
    }

    try{
      const sRes = await fetch("/settings-data?companyId=" + encodeURIComponent(result.companyId));
      const sData = await sRes.json();
      const isComplete = sData && sData.isComplete === true;
      window.location.href = isComplete ? "/dashboard" : "/onboarding";
    }catch(e){
      window.location.href = "/dashboard";
    }
  }catch(e){
    msg.className = "msg error";
    msg.innerText = "Connection error.";
  }
}

document.getElementById("loginBtn").onclick = loginUser;
document.getElementById("registerBtn").onclick = registerUser;
document.getElementById("googleBtn").onclick = function(){
  window.location.href = "/auth/google";
};
</script>

</body>
</html>
