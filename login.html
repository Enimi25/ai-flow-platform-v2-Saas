<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at top left,#123524,#050816 45%,#020617);
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:420px;
  background:#0f172a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:36px;
}
.logo{font-size:34px;font-weight:900;margin-bottom:8px}
.logo span{color:#4ade80}
.sub{color:#94a3b8;margin-bottom:26px;line-height:1.5}
label{display:block;margin-bottom:8px;color:#cbd5e1;font-size:14px}
input{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:#020617;
  color:white;
  font-size:15px;
}
.btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
  margin-bottom:12px;
}
.login{background:#4ade80;color:#020617}
.register{background:#1e293b;color:white;border:1px solid rgba(255,255,255,.1)}
.msg{margin-top:12px;color:#94a3b8;min-height:22px}
.error{color:#fb7185}
.success{color:#4ade80}
</style>
</head>

<body>

<div class="box">
  <div class="logo">AI <span>FLOW</span></div>
  <div class="sub">Login or create an account to access your AI sales dashboard.</div>

  <label>Email</label>
  <input id="email" type="email" placeholder="client@example.com">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <button class="btn login" id="loginBtn">Login</button>
  <button class="btn register" id="registerBtn">Create New Account</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const msg = document.getElementById("msg");

function getValues(){
  return {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value.trim()
  };
}

async function registerUser(){
  const data = getValues();

  msg.className = "msg";
  msg.innerText = "Creating account...";

  if(!data.email || !data.password){
    msg.className = "msg error";
    msg.innerText = "Enter email and password.";
    return;
  }

  try{
    const res = await fetch("/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const result = await res.json();

    if(!res.ok || result.error){
      msg.className = "msg error";
      msg.innerText = result.error || "Register error.";
      return;
    }

    msg.className = "msg success";
    msg.innerText = "Account created. Now click Login.";
  }catch(e){
    msg.className = "msg error";
    msg.innerText = "Connection error.";
  }
}

async function loginUser(){
  const data = getValues();

  msg.className = "msg";
  msg.innerText = "Logging in...";

  if(!data.email || !data.password){
    msg.className = "msg error";
    msg.innerText = "Enter email and password.";
    return;
  }

  try{
    const res = await fetch("/login-api",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const result = await res.json();

    if(!res.ok || result.error){
      msg.className = "msg error";
      msg.innerText = result.error || "Login error.";
      return;
    }

    localStorage.setItem("ai_flow_email", result.email);
    localStorage.setItem("ai_flow_role", result.role);
    localStorage.setItem("ai_flow_company_id", result.companyId);

    if(result.role === "admin"){
      window.location.href = "/admin";
      return;
    }

    try{
      const sRes = await fetch("/settings-data?companyId=" + encodeURIComponent(result.companyId));
      const sData = await sRes.json();
      const isComplete = sData && sData.isComplete === true;
      window.location.href = isComplete ? "/dashboard" : "/onboarding";
    }catch(e){
      window.location.href = "/dashboard";
    }
  }catch(e){
    msg.className = "msg error";
    msg.innerText = "Connection error.";
  }
}

document.getElementById("loginBtn").onclick = loginUser;
document.getElementById("registerBtn").onclick = registerUser;
</script>

</body>
</html>
