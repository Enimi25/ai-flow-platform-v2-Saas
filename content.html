<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FLOW Content Factory</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050816;
  --bg2:#070b1d;
  --sidebarA:#0b1023;
  --panel:#0f172a;
  --panel2:#111936;
  --input:#020617;
  --text:#ffffff;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.06);
  --accent:#4ade80;
  --accent2:#22c55e;
  --r12:12px;
  --r14:14px;
  --r16:16px;
  --r20:20px;
  --shadow:0 14px 40px rgba(0,0,0,.35);
  --shadowSm:0 8px 22px rgba(0,0,0,.28);
}

body{
  background:
    radial-gradient(1200px 800px at 18% -10%, rgba(74,222,128,.12), transparent 55%),
    radial-gradient(900px 700px at 110% 10%, rgba(96,165,250,.10), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans","Helvetica Neue",sans-serif;
  line-height:1.4;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:linear-gradient(180deg, var(--sidebarA) 0%, var(--bg2) 100%);
  border-right:1px solid var(--border);
  padding:26px 18px;
  height:100vh;
  position:sticky;
  top:0;
  overflow:auto;
}

.logo{
  font-size:26px;
  font-weight:950;
  margin-bottom:22px;
  letter-spacing:.2px;
}

.logo span{color:var(--accent)}

.menu{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:6px;
}

.menu a{
  text-decoration:none;
  color:#cbd5e1;
  padding:12px 12px;
  border-radius:var(--r14);
  font-size:14px;
  font-weight:800;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease;
}

.menu a:hover{
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.08);
  color:#ffffff;
}

.menu .active{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
  color:#03140a;
  font-weight:900;
  border-color:rgba(0,0,0,.12);
  box-shadow:0 10px 24px rgba(34,197,94,.18);
}

.main{
  flex:1;
  padding:32px 28px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.main > *{
  width:100%;
  max-width:1120px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

h1{
  font-size:36px;
  margin-bottom:8px;
  letter-spacing:-.2px;
}

.sub{
  color:var(--muted);
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
}

.logout{
  background:rgba(30,41,59,.70);
  color:white;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:900;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.actions{
  display:flex;
  gap:12px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:900;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.green{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
  color:#03140a;
  box-shadow:0 10px 24px rgba(34,197,94,.18);
}

.dark{
  background:rgba(30,41,59,.72);
  color:white;
  border:1px solid rgba(255,255,255,.10);
}

.logout:hover,.dark:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.16);
  box-shadow:var(--shadowSm);
}
.green:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 34px rgba(34,197,94,.22);
}
.logout:active,.dark:active,.green:active{
  transform:translateY(0);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.card{
  background:linear-gradient(180deg, rgba(15,23,42,.96) 0%, rgba(15,23,42,.88) 100%);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
}

.card h2{
  font-size:24px;
  margin-bottom:18px;
}

label{
  display:block;
  color:var(--muted);
  font-size:14px;
  margin-bottom:8px;
}

input, select, textarea{
  width:100%;
  background:rgba(2,6,23,.92);
  color:white;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(74,222,128,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 3px rgba(74,222,128,.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}

.post{
  background:rgba(17,25,54,.72);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.post h3{
  margin-bottom:8px;
}

.post p{
  color:#cbd5e1;
  line-height:1.5;
  font-size:14px;
}

.meta{
  margin-top:12px;
  color:#4ade80;
  font-size:12px;
  font-weight:900;
}

.post-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.mini{
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:950;
  box-shadow:none;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(30,41,59,.55);
  color:white;
}
.mini:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadowSm);
  border-color:rgba(255,255,255,.16);
}
.mini:active{transform:translateY(0)}
.mini-green{
  background:rgba(20,83,45,.55);
  color:#b9f6cc;
  border-color:rgba(74,222,128,.20);
}
.mini-yellow{
  background:rgba(66,32,6,.55);
  color:#fde68a;
  border-color:rgba(250,204,21,.22);
}
.mini-blue{
  background:rgba(30,58,138,.45);
  color:#bfdbfe;
  border-color:rgba(96,165,250,.25);
}
.mini-red{
  background:rgba(127,29,29,.45);
  color:#fecaca;
  border-color:rgba(248,113,113,.30);
}

.msg{
  color:var(--muted);
  margin-bottom:16px;
}

.empty{
  color:var(--muted);
  line-height:1.5;
}

@media(max-width:900px){
  body{display:block}
  .sidebar{width:100%;height:auto;position:relative}
  .main > *{max-width:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">AI <span>FLOW</span></div>

  <div class="menu">
    <a href="/dashboard">Dashboard</a>
    <a href="/leads-page">Leads</a>
    <a href="/content-factory" class="active">Content Factory</a>
    <a href="/social-accounts">Social Accounts</a>
    <a href="/ai-replies">AI Replies</a>
    <a href="/analytics">Analytics</a>
    <a href="/calendar">Calendar</a>
    <a href="/billing">Billing</a>
    <a href="/settings">Settings</a>
  </div>

</div>

<div class="main">

  <div class="top">
    <div>
      <h1>Content Factory</h1>
      <div class="sub">Generate and manage social posts for this client.</div>
    </div>

    <div class="user">
      <div id="clientEmail">Client</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="actions">
    <button class="green" onclick="generatePost()">Generate AI Post</button>
    <button class="dark" onclick="loadPosts()">Refresh Posts</button>
    <button class="dark" onclick="goDashboard()">Back to Dashboard</button>
  </div>

  <div id="msg" class="msg">Loading...</div>

  <div class="grid">

    <div class="card">
      <h2>Create New Post</h2>

      <label>Platform</label>
      <select id="platform">
        <option>Instagram</option>
        <option>Facebook</option>
        <option>TikTok</option>
        <option>LinkedIn</option>
      </select>

      <label>Post Type</label>
      <select id="postType">
        <option>caption</option>
        <option>ad</option>
        <option>reel idea</option>
        <option>story</option>
        <option>carousel</option>
      </select>

      <label>Topic</label>
      <textarea id="topic">AI sales automation for small businesses</textarea>

      <button class="green" onclick="generatePost()">Generate Content</button>
    </div>

    <div class="card">
      <h2>Saved Posts</h2>
      <div id="postsBody">
        <div class="empty">No posts yet.</div>
      </div>
    </div>

  </div>

</div>

<script>
const email = localStorage.getItem("ai_flow_email");
const companyId = localStorage.getItem("ai_flow_company_id");

if (!email || !companyId) {
  window.location.href = "/login";
}

document.getElementById("clientEmail").innerText = email;

function logout(){
  localStorage.removeItem("ai_flow_email");
  localStorage.removeItem("ai_flow_role");
  localStorage.removeItem("ai_flow_company_id");
  window.location.href = "/login";
}

function goDashboard(){
  window.location.href = "/dashboard";
}

function setMsg(text){
  document.getElementById("msg").innerText = text;
}

async function loadPosts(){
  setMsg("Loading posts...");

  try{
    const res = await fetch("/dashboard-data?companyId=" + encodeURIComponent(companyId));
    const data = await res.json();

    if(!res.ok || data.error){
      setMsg(data.error || "Error loading posts.");
      return;
    }

    const posts = data.posts || [];
    const body = document.getElementById("postsBody");
    body.innerHTML = "";

    if(!posts.length){
      body.innerHTML = '<div class="empty">No posts yet.</div>';
      setMsg("No posts yet.");
      return;
    }

    posts.forEach(post => {
      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <h3>${post.title || "Untitled Post"}</h3>
        <p>${post.content || ""}</p>
        <div class="meta">${post.platform || ""} · ${post.post_type || ""} · ${post.status || "draft"}</div>
        <div class="post-actions">
          <button class="mini mini-yellow" onclick="setPostStatus(${post.id}, 'draft')">Draft</button>
          <button class="mini mini-green" onclick="setPostStatus(${post.id}, 'approved')">Approve</button>
          <button class="mini mini-blue" onclick="setPostStatus(${post.id}, 'published')">Publish</button>
          <button class="mini mini-red" onclick="deletePost(${post.id})">Delete</button>
        </div>
      `;

      body.appendChild(div);
    });

    setMsg("Loaded " + posts.length + " posts.");

  }catch(e){
    setMsg("Connection error.");
  }
}

async function setPostStatus(id, status){
  setMsg("Updating post...");

  try{
    const res = await fetch("/update-content-post", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        id: id,
        status: status
      })
    });

    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Update post error.");
      return;
    }

    setMsg("Post updated.");
    loadPosts();

  }catch(e){
    setMsg("Connection error updating post.");
  }
}

async function deletePost(id){
  if(!confirm("Delete this post?")) return;
  setMsg("Deleting post...");

  try{
    const res = await fetch("/delete-content-post", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        id: id
      })
    });

    const data = await res.json();
    if(!res.ok || data.error){
      setMsg(data.error || "Delete post error.");
      return;
    }

    setMsg("Post deleted.");
    loadPosts();

  }catch(e){
    setMsg("Connection error deleting post.");
  }
}

async function generatePost(){
  const platform = document.getElementById("platform").value;
  const postType = document.getElementById("postType").value;
  const topic = document.getElementById("topic").value.trim();

  setMsg("Generating post...");

  try{
    const res = await fetch("/create-content-post", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        companyId: companyId,
        platform: platform,
        postType: postType,
        topic: topic
      })
    });

    const data = await res.json();

    if(!res.ok || data.error){
      setMsg(data.error || "Error generating post.");
      return;
    }

    setMsg("Post generated.");
    loadPosts();

  }catch(e){
    setMsg("Connection error generating post.");
  }
}

loadPosts();
</script>

<script>
(function(){
  try{
    const companyId = localStorage.getItem("ai_flow_company_id");
    if(!companyId) return;
    if(document.querySelector('script[src="/widget.js"], script[src$="/widget.js"], script[src*="widget.js"]')) return;
    const script = document.createElement("script");
    script.src = "/widget.js";
    script.setAttribute("data-company-id", companyId);
    document.body.appendChild(script);
  }catch(e){}
})();
</script>

</body>
</html>
